name: Validate Agent Skills & Security

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate SKILL.md Frontmatter & Spec
        run: |
          echo "Validating SKILL.md existence and format..."
          test -f skills/qrspi-methodology/SKILL.md
          grep -q "^name: qrspi-methodology" skills/qrspi-methodology/SKILL.md
          grep -q "^description:" skills/qrspi-methodology/SKILL.md
          grep -q "^license: MIT" skills/qrspi-methodology/SKILL.md

      - name: Lint Shell Scripts
        run: |
          shellcheck .github/scripts/verify-security.sh
          shellcheck skills/qrspi-methodology/scripts/verify-session.sh
          shellcheck skills/qrspi-methodology/hooks/prompt-hook.sh

      - name: Run Repository Security & Integrity Audit
        run: |
          ./.github/scripts/verify-security.sh

      - name: Test Session Validator Script
        run: |
          ./skills/qrspi-methodology/scripts/verify-session.sh skills/qrspi-methodology/references/stage-templates
