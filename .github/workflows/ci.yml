name: Validate Agent Skills & Security

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate All SKILL.md Frontmatter & Spec
        run: |
          echo "Validating all SKILL.md files in repository..."
          for skill_file in skills/*/SKILL.md; do
            echo "Checking ${skill_file}..."
            test -f "${skill_file}"
            grep -q "^name:" "${skill_file}"
            grep -q "^description:" "${skill_file}"
            grep -q "^license: MIT" "${skill_file}"
          done

      - name: Lint All Shell Scripts
        run: |
          echo "Running shellcheck on all repository shell scripts..."
          find . -name "*.sh" -not -path "*/.git/*" -exec shellcheck {} +

      - name: Run Repository Security & Integrity Audit
        run: |
          ./.github/scripts/verify-security.sh

      - name: Test Skill Verification Scripts
        run: |
          echo "Testing QRSPI session validator..."
          ./skills/qrspi-methodology/scripts/verify-session.sh skills/qrspi-methodology/references/stage-templates
          
          echo "Testing Docker & Orchestration stack auditor..."
          ./skills/docker-and-orchestration/scripts/verify-docker-stack.sh --help
